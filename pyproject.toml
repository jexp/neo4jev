[project]
name = "neo4jev"
version = "0.1.0"
description = "Graph navigation demo: TypeSafe Jev + Neo4j"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "neo4j-rust-ext>=6.3.1.0",
    "neo4j-viz[neo4j,streamlit]>=1.8.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
    "typesafe-sdk>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neo4jev"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]
