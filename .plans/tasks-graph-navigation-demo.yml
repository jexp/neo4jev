  - id: task-015
    title: "Collapse repeated GoalSpec switches into a per-hop GoalView"
    description: |
      GoalSpec's tagged union is re-dispatched via isinstance in six functions
      (_stages_for, _goal_description, _noul_true_description, _choice_instructions,
      _goal_reached_by_noul, _select_result_paths) and one_hop threads the derived
      (goal, stages, stage_index) triple plus two `assert stages is not None` guards into
