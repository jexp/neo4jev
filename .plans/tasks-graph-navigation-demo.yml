  - id: task-003
    title: 'Add shared types.py contract (NavCandidate, NavStep, NavResult, BeamState, GoalSpec)'
    description: |
      Create src/neo4jev/types.py defining the shared data contract used by neo4j_access.py,
      navigator.py, and viz.py: NavCandidate (edge_key, rel_element_id, rel_type, rel_props,
      target_element_id, target_label, target_props), NavStep (node id, candidates considered,
      chosen candidate(s), probabilities, log_prob delta), NavResult (one or more NavStep
      sequences/paths, visited-neighborhood node/rel ids, termination reason(s)), BeamState
      (frontier of partial paths with cumulative log-prob and a visited-node set per branch),
      and GoalSpec as a tagged union/discriminated dataclass covering the three goal modes:
      free_text (goal description string), target_node (element id + label), and path_intent
      (pattern description string + optional stage list + top_n paths to return). Use plain
      dataclasses (or pydantic if simpler given neo4j_viz already depends on pydantic) —
      match whichever style is already used elsewhere in the dependency tree. Add unit tests
      that construct each type and validate basic invariants (e.g. GoalSpec discriminates
      correctly on its mode field).
    status: completed
    dependencies: []
    acceptance_criteria:
      - "src/neo4jev/types.py defines NavCandidate, NavStep, NavResult, BeamState, GoalSpec"
      - "GoalSpec supports exactly the three modes: free_text, target_node, path_intent"
      - "tests/unit/test_types.py passes with no network access"
      - "Types are plain dataclasses/pydantic models with no Neo4j or TypeSafe SDK imports (kept decoupled)"
    completed_at: 2026-09-16T00:46:56Z

  - id: task-004
    title: 'Implement neo4j_access.py (driver, index detection, node lookup, neighborhood fetch)'
    description: |
      Create src/neo4jev/neo4j_access.py using the neo4j driver (installed via neo4j-rust-ext,
      same `import neo4j` namespace) and src/neo4jev/config.py for connection settings. Implement:
      a driver context manager; list_labels(); detect_indexes(label) that queries `SHOW INDEXES`
      to determine which of exact (always available)/fulltext/vector lookup modes apply to a
      given label; search_start_nodes(label, query, mode) implementing exact substring/equality
      match, a fulltext CALL db.index.fulltext.queryNodes query, and a vector
      CALL db.index.vector.queryNodes query (embed the query text — inspect what embedding
      dimension/model the target index expects, e.g. via index metadata, and document the
      embedding approach used); get_outgoing_relationships(node_id, rel_type_cap=10, total_cap=60)
      returning a capped list of NavCandidate (from types.py) plus truncation metadata
      ("N of M edges considered") when capped; get_node_neighborhood(node_ids) for
      visualization context. All label/relationship-type/property names must be discovered
      live, never hardcoded. Write unit tests with a mocked/fake driver covering the capping
      and truncation-reporting logic and the edge_key generation/mapping. Write integration
      tests (tests/integration/test_neo4j_companies_kg.py) against the live Companies KG
      (neo4j+s://demo.neo4jlabs.com:7687, db companies) verifying: list_labels() returns
      expected labels, detect_indexes("Organization") finds the `entity` fulltext index,
      a fulltext search for a well-known company name returns results, and
      get_outgoing_relationships on a real node returns a non-empty capped candidate list.
    status: completed
    dependencies:
