  - id: task-005
    title: 'Implement navigator.py (TypeSafe Choice+Noul beam search, all 3 goal modes)'
    description: |
      Create src/neo4jev/navigator.py wrapping typesafe_sdk.TypeSafeClient (or
      AsyncTypeSafeClient) to run beam-search graph navigation. Per hop: build one Choice
      question (options keyed by synthetic ids e0,e1,... mapped back to NavCandidate via a
      side table — never key by relationship type) with criteria/instructions describing each
      candidate edge+target, plus one Noul question ("has the goal been reached?"), both in a
      single system_one call, using a `state` built from the current node's data and the
      GoalSpec (from types.py). Implement all three goal modes per the PRD: free_text (Noul
      criteria = the free-text description), target_node (terminate when the exact target
      element id is reached, independent of Noul), and path_intent (decompose the pattern
      description into ordered stage-guidance strings, bias Choice.instructions per hop toward
      the current stage's semantics, test Noul against the final stage's class description,
      run multiple beam branches concurrently, return the configurable top-N distinct
      best-scoring paths rather than one). Implement: visited-node cycle guard, max depth,
      max API-call budget, and path scoring by sum of log-probabilities. Return a NavResult
      (types.py). Write unit tests with a mocked TypeSafe client asserting: correct edge_key
      to NavCandidate mapping, correct top-k/cutoff filtering of probabilities, correct
      cumulative log-probability scoring, cycle/depth/budget guards trigger correctly, and
      path_intent mode returns multiple distinct paths when multiple branches score well.
      Write one integration test making a single real TypeSafe system_one call combined with
      one real Neo4j hop (gated on required env vars being present).
    status: completed
    dependencies:
      - task-002
      - task-003
    acceptance_criteria:
      - "src/neo4jev/navigator.py implements a single-hop function issuing exactly one system_one call per hop with both a Choice and a Noul question"
      - "Choice options are keyed by synthetic opaque ids with a side mapping table back to NavCandidate"
      - "Beam search enforces a visited-node cycle guard, max depth, and max API-call budget"
      - "Path scoring uses sum of log-probabilities"
      - "All three GoalSpec modes (free_text, target_node, path_intent) are implemented, with path_intent returning top-N distinct paths"
      - "tests/unit/test_navigator_scoring.py passes with a mocked TypeSafe client, no network access"
      - "tests/integration/test_navigator_live.py passes (or is properly skipped when credentials are absent) against real TypeSafe + Neo4j"
    completed_at: 2026-09-16T01:10:26Z

